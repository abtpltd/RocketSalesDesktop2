[workspace]
members = [".", "core"]
resolver = "2"

[package]
name = "rocketsales-desktop"
version = "0.2.0"
description = "RocketSales Backoffice desktop app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "rocketsales_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rocketsales-core = { path = "core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = "2"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
